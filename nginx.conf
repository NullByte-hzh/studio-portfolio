server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Enable gzip compression for faster loading
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml text/xml application/xml application/xml+rss text/javascript;

    # Cache static resources
    location ~* \.(svg|png|jpg|jpeg|gif|ico|json|manifest|js|css)$ {
        expires 30d;
        add_header Cache-Control public;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
