server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 不暴露 nginx 版本号
    server_tokens off;

    # ===== 压缩 =====
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml text/xml application/xml application/xml+rss text/javascript;
    # 优先发送构建期预压缩好的 .gz（镜像构建时生成），运行时零 CPU 开销
    gzip_static on;

    # ===== 安全：源码与元数据一律不外泄 =====
    # 任何以 . 开头的路径（.git / .env / .DS_Store ...）→ 404，不用 403 以免暴露存在性
    location ~ /\. { return 404; access_log off; log_not_found off; }
    # 部署脚本、内部文档、测试报告不属于站点内容
    location ~ ^/(deploy|docs)/ { return 404; access_log off; }
    # 源码/构建产物类型兜底（admin/config.yml 由下面的精确匹配放行）
    location ~* \.(md|py|yml|yaml|toml|mjs|sh|patch|sql|zip|log|gz)$ { return 404; access_log off; }

    # ===== 缓存策略 =====
    # 需要随部署立即生效的文件：不强缓存，每次协商验证（避免 PWA 更新被卡住）
    location = /index.html        { add_header Cache-Control "no-cache" always; }
    location = /service-worker.js { add_header Cache-Control "no-cache, must-revalidate" always; }
    location = /manifest.json     { add_header Cache-Control "no-cache" always; }
    location = /admin/config.yml  { add_header Cache-Control "no-cache" always; }

    # 其余静态资源长缓存
    location ~* \.(svg|png|jpg|jpeg|gif|webp|avif|ico|woff2?|ttf|css|js)$ {
        # 只用一个 Cache-Control，避免 expires 与 add_header 各发一个同名头
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        access_log off;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
